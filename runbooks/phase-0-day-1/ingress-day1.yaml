# Phase 0 Day 1 — Ingress manifest (cleaned for version control)
# Runtime fields (uid, resourceVersion, status, last-applied-configuration) removed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-echo-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: api.<your-subdomain>.chickenkiller.com
      http:
        paths:
          - backend:
              service:
                name: http-echo
                port:
                  number: 80
            path: /
            pathType: Prefix
