# Phase 0 Day 3 — Ingress with IP whitelist + TLS (cleaned for version control)
# Runtime fields (uid, resourceVersion, status, last-applied-configuration) removed.
# Real IP replaced with placeholder.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: http-echo-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/whitelist-source-range: "<YOUR_PUBLIC_IP>/32"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.<your-subdomain>.chickenkiller.com
      secretName: http-echo-tls  # pragma: allowlist secret
  rules:
    - host: api.<your-subdomain>.chickenkiller.com
      http:
        paths:
          - backend:
              service:
                name: http-echo
                port:
                  number: 80
            path: /
            pathType: Prefix
